name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # setup-node ships npm 10 with Node 22 and npm 11 with Node 24, and the
      # two disagree about promptfoo's optional peers, so npm ci fails on one
      # or the other. Use the npm major the lockfile is generated with.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
