description: "GTFS MCP tools evaluation"

# The system prompt doesn't name the system: the model has to discover it with
# list_systems, as it would in a real client. Unlike Claude Desktop, promptfoo
# doesn't pass the server's `instructions` to the model, so it only has the
# tool descriptions to go on.
prompts:
  - id: "transit-query"
    raw: |
      [
        {
          "role": "system",
          "content": "You are a transit assistant with access to GTFS tools. Use the tools to answer queries — do not rely on your own knowledge."
        },
        {
          "role": "user",
          "content": "{{query}}"
        }
      ]

# Every model gets identical settings so the comparison only varies the model.
# - thinking must be set explicitly: without it promptfoo sends temperature: 0,
#   which the 5.5 models reject.
# - effort is pinned because the defaults differ (medium on Opus/Haiku 5.5,
#   high on Sonnet 5.5). Sweep it as a separate experiment.
# - showThinking: false, because thinking text is omitted by default on these
#   models and each output would otherwise carry an empty block with a long
#   signature, cluttering the results view.
# - max_tool_calls caps the tool loop promptfoo runs against the real server
#   (and so live feeds). promptfoo's default of 8 cut off Opus while it was
#   still legitimately looking up stops, so it's raised to only catch runaway
#   loops. A run that hits it is a provider error, which the summary counts as
#   a failure rather than leaving it out.
providers:
  - id: anthropic:messages:claude-haiku-5-5
    label: haiku-5.5
    config: &model_config
      thinking:
        type: adaptive
      effort: medium
      max_tokens: 4096
      showThinking: false
      max_tool_calls: 20
      mcp:
        enabled: true
        server:
          command: node
          args:
            - dist/index.js
  - id: anthropic:messages:claude-sonnet-5-5
    label: sonnet-5.5
    config: *model_config
  - id: anthropic:messages:claude-opus-5-5
    label: opus-5.5
    config: *model_config

# Cases declare the calls they expect in `metadata.expect` (require / order /
# noTools); the format is documented on gradeToolCalls in evals/tool-calls.js.
defaultTest:
  assert:
    - type: javascript
      value: file://evals/tool-calls.js:assertToolCalls

tests:
  # --- Tool selection: basic coverage ---

  - description: "Systems: discover available systems"
    vars:
      query: "What subway networks can I query?"
    metadata:
      expect:
        require:
          - tool: list_systems

  - description: "Stops: search by name"
    vars:
      query: "I'm trying to find stops around Grand Central"
    metadata:
      expect:
        require:
          - tool: search_stops

  - description: "Stops: find near coordinates"
    vars:
      query: "What subway stops are near latitude 40.7580, longitude -73.9855?"
    metadata:
      expect:
        require:
          - tool: find_nearby_stops
            input: { lat: 40.758, lon: -73.9855 }

  - description: "Stops: get details by ID"
    vars:
      query: "What routes serve stop 127N?"
    metadata:
      expect:
        require:
          - tool: get_stop
            input: { stop_id: "127N" }

  - description: "Routes: list all"
    vars:
      query: "What routes are in the system?"
    metadata:
      expect:
        require:
          - tool: list_routes

  - description: "Routes: get details with direction"
    vars:
      query: "What stops does the 1 train make going northbound?"
    metadata:
      expect:
        require:
          - tool: get_route
            input: { route_id: "1" }

  - description: "Arrivals: upcoming trains at a stop"
    vars:
      query: "When is the next train arriving at stop 127N?"
    metadata:
      expect:
        require:
          - tool: get_arrivals
            input: { stop_id: "127N" }

  - description: "Alerts: check service disruptions"
    vars:
      query: "Is there anything disrupting subway service today?"
    metadata:
      expect:
        require:
          - tool: get_alerts

  - description: "Vehicles: track positions with route filter"
    vars:
      query: "Where are all the 1 train cars right now?"
    metadata:
      expect:
        require:
          - tool: get_vehicles
            input: { route_id: "1" }

  - description: "Trips: look up specific trip"
    vars:
      query: "Can you pull up the details for trip 075850_1..N03R?"
    metadata:
      expect:
        require:
          - tool: get_trip
            input: { trip_id: "075850_1..N03R" }

  - description: "Feed health diagnostics"
    vars:
      query: "Are the realtime feeds healthy for mta-subway? Any fetch errors?"
    metadata:
      expect:
        require:
          - tool: get_feed_health

  # --- Multi-tool ---

  - description: "Multi-tool: arrivals + alerts together"
    vars:
      query: "I'm at stop 127N — what trains are coming and are there any service alerts?"
    metadata:
      expect:
        require:
          - tool: get_arrivals
            input: { stop_id: "127N" }
          - tool: get_alerts

  # --- Negative / disambiguation ---

  - description: "Negative: off-topic query should not call tools"
    vars:
      query: "What's the weather like in Manhattan today?"
    metadata:
      expect:
        noTools: true

  - description: "Negative: ambiguous stop name should search, not get"
    vars:
      query: "Tell me about the Park Place stop"
    metadata:
      expect:
        require:
          - tool: search_stops
        # Looking the stop up after searching is fine; guessing its ID isn't.
        order:
          - [search_stops, get_stop]

  - description: "Negative: arrivals without stop ID should search first"
    vars:
      query: "When's the next train at Fulton Street?"
    metadata:
      expect:
        # get_arrivals isn't required: there are five Fulton St stations, so
        # asking which one is a good answer too.
        require:
          - tool: search_stops
        order:
          - [search_stops, get_arrivals]
